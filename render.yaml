services:
  # 1. Frontend Web Service / Static Site
  - type: web
    name: citysolveai
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # 2. Python FastAPI Backend (Optional Web Service)
  - type: web
    name: citysolveai-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
